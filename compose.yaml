services:
  server:
    build: .
    restart: unless-stopped
    ports:
      - "7001:7001/udp"
    volumes:
      - server-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  server-data:
